<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pastizzi Master</title>
<style>
  html,body{margin:0;height:100dvh;overflow:hidden;background:#1c0e1e;font-family:system-ui;
            overscroll-behavior:none;-webkit-user-select:none;user-select:none}
  #c{width:100vw;height:100dvh;touch-action:none;display:block}
  #hud{position:fixed;top:calc(10px + env(safe-area-inset-top));left:0;right:0;display:flex;
       justify-content:center;gap:10px;z-index:5;pointer-events:none}
  .chip{background:rgba(20,8,6,.82);border:2px solid #e8b54a;border-radius:999px;color:#ffe08a;
        font-weight:900;font-size:15px;padding:7px 16px;text-shadow:0 1px 3px #000}
  #msg{position:fixed;bottom:calc(150px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;
       color:#fff;font-weight:800;font-size:15px;text-shadow:0 2px 6px #000;z-index:5;min-height:20px;pointer-events:none}
  #spin{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:5;
        font:900 20px system-ui;letter-spacing:2px;color:#5c2404;cursor:pointer;display:none;
        background:linear-gradient(180deg,#ffd97a,#e8a52a);border:3px solid #ffe9ad;border-radius:999px;
        padding:13px 54px;box-shadow:0 6px 0 #9c6f15,0 12px 26px rgba(0,0,0,.55)}
  #spin:active{transform:translateX(-50%) translateY(5px);box-shadow:0 1px 0 #9c6f15}
  #spin:disabled{opacity:.55}
  .bet{font:900 14px system-ui;color:#ffd98a;background:rgba(30,12,8,.9);border:2px solid #9c6f15;
       border-radius:999px;padding:8px 16px;cursor:pointer;opacity:.55}
  .bet.on{opacity:1;border-color:#ffe08a;box-shadow:0 0 12px rgba(255,214,90,.5)}
  @keyframes flashwin{0%,100%{opacity:0}30%{opacity:.55}}
  #flash{position:fixed;inset:0;background:radial-gradient(circle,#ffd97a55,#ff572211);z-index:4;
         pointer-events:none;opacity:0}
  #flash.go{animation:flashwin .5s ease-out}
  #tabs{position:fixed;bottom:0;left:0;right:0;display:flex;z-index:6;
        background:rgba(16,7,5,.94);border-top:2px solid #e8b54a;
        padding-bottom:env(safe-area-inset-bottom)}
  #tabs button{flex:1;background:none;border:none;color:#b09a80;font:800 13px system-ui;
        padding:10px 0 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
  #tabs button.on{color:#ffe08a}
  #tabs button span{font-size:22px;line-height:1}
  #tabs button.on span{transform:scale(1.15)}
</style>
</head>
<body>
<div id="hud">
  <div class="chip">🪙 <span id="coins">0</span></div>
  <div class="chip">🎰 <span id="spins">0</span></div>
</div>
<div id="msg"></div>
<div id="lvlbar" style="position:fixed;top:calc(52px + env(safe-area-inset-top));left:0;right:0;display:none;justify-content:center;gap:8px;z-index:5;pointer-events:none">
  <div class="chip" style="font-size:13px">LVL <span id="lv">1</span></div>
  <div class="chip" style="font-size:13px">🎯 <span id="prog">0</span>/<span id="tgt">600</span></div>
  <div class="chip" style="font-size:13px">🥾 <span id="mvs">20</span></div>
</div>
<div id="bets" style="position:fixed;bottom:calc(148px + env(safe-area-inset-bottom));left:0;right:0;display:none;justify-content:center;gap:8px;z-index:5">
  <button class="bet on" data-b="1">x1</button><button class="bet" data-b="2">x2</button><button class="bet" data-b="5">x5</button><button class="bet" data-b="10">x10</button>
</div>
<button id="spin">SPIN</button>
<div id="flash"></div>
<canvas id="c"></canvas>
<div id="tabs">
  <button id="tb-v" class="on"><span>🏝️</span>VILLAGE</button>
  <button id="tb-s"><span>🎰</span>SLOT</button>
  <button id="tb-c"><span>🥟</span>CRUSH</button>
</div>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
<script>
const canvas = document.getElementById('c');
const engine = new BABYLON.Engine(canvas, true, { adaptToDeviceRatio: true, limitDeviceRatio: 2 });
// iOS zoom killers: Safari ignores user-scalable=no for double-tap & pinch
document.addEventListener('gesturestart', e => e.preventDefault(), { passive: false });
document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
let lastTouch = 0;
document.addEventListener('touchend', e => {
  const now = Date.now();
  if (now - lastTouch < 350) e.preventDefault();   // swallow double-tap zoom
  lastTouch = now;
}, { passive: false });

// ---------- sound engine (pure WebAudio, zero downloads) ----------
let AC = null;
const ac = () => AC || (AC = new (window.AudioContext || window.webkitAudioContext)());
function blip(f, dur=0.08, type='square', g=0.12, slide=0){
  try{ const a = ac(), o = a.createOscillator(), gn = a.createGain();
    o.type = type; o.frequency.value = f;
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide), a.currentTime+dur);
    gn.gain.setValueAtTime(g, a.currentTime);
    gn.gain.exponentialRampToValueAtTime(0.001, a.currentTime+dur);
    o.connect(gn).connect(a.destination); o.start(); o.stop(a.currentTime+dur); }catch(e){}
}
function jingle(notes, step=0.09, type='triangle', g=0.16){
  notes.forEach((n,i)=> setTimeout(()=> blip(n, step*1.8, type, g), i*step*1000));
}
const sfx = {
  click: () => blip(700, .05, 'square', .08),
  lever: () => { blip(180, .12, 'sawtooth', .18, -80); setTimeout(()=>blip(90,.15,'square',.2),90); },
  tick:  () => blip(520 + Math.random()*160, .03, 'square', .05),
  stop: (i) => { blip(240 - i*40, .12, 'square', .22); if(navigator.vibrate) try{navigator.vibrate(25);}catch(e){} },
  win:   () => { jingle([523,659,784,1047], .09); if(navigator.vibrate) try{navigator.vibrate([30,40,80]);}catch(e){} },
  jackpot:() => { jingle([392,523,659,784,1047,1319,1568], .1, 'triangle', .2);
                  setTimeout(()=>jingle([1047,1319,1568,2093], .12), 750);
                  if(navigator.vibrate) try{navigator.vibrate([60,50,60,50,160]);}catch(e){} },
  coin:  () => { for(let i=0;i<6;i++) setTimeout(()=>blip(1400+Math.random()*900,.06,'triangle',.09), i*70); },
  match: (n) => blip(500 + n*90, .09, 'triangle', .14),
};

// ---------- shared wallet ----------
const REGEN = 720, CAP = 50;
let coins = +(localStorage.pm_coins ?? 3000);
let spins = +(localStorage.pm_spins ?? 25);
{ const then = +(localStorage.pm_ts ?? Date.now());
  const gained = Math.floor((Date.now() - then) / (REGEN * 1000));
  if (gained > 0 && spins < CAP) spins = Math.min(CAP, spins + gained); }
function save(){ localStorage.pm_coins = coins; localStorage.pm_spins = spins; localStorage.pm_ts = Date.now(); }
const coinsEl = document.getElementById('coins'), spinsEl = document.getElementById('spins'),
      msgEl = document.getElementById('msg'), spinBtn = document.getElementById('spin');
function hud(){ coinsEl.textContent = coins; spinsEl.textContent = spins; spinBtn.disabled = spinning || spins <= 0; }
function toast(s){ msgEl.textContent = s; clearTimeout(toast._t); toast._t = setTimeout(() => msgEl.textContent = '', 3200); }
setInterval(() => { if (spins < CAP){ spins++; hud(); save(); } }, REGEN * 1000);

// =================================================================
// SCENE 1 — VILLAGE (camera locked, world alive)
// =================================================================
const sV = new BABYLON.Scene(engine);
{
  sV.clearColor = BABYLON.Color4.FromHexString('#9E9AC4FF');
  const cam = new BABYLON.ArcRotateCamera('cv', -Math.PI/4, 0.92, 36, new BABYLON.Vector3(0,-0.8,0), sV);
  // NO attachControl — screen locked
  new BABYLON.HemisphericLight('h', new BABYLON.Vector3(0,1,0), sV).intensity = 0.65;
  const sun = new BABYLON.DirectionalLight('sun', new BABYLON.Vector3(-0.6,-1,-0.4), sV);
  sun.position = new BABYLON.Vector3(18,26,14); sun.intensity = 1.15;
  const sg = new BABYLON.ShadowGenerator(1536, sun);
  sg.useBlurExponentialShadowMap = true; sg.blurKernel = 24;
  const mat = hex => { const m = new BABYLON.StandardMaterial('m', sV);
    m.diffuseColor = BABYLON.Color3.FromHexString(hex); m.specularColor = BABYLON.Color3.Black(); return m; };
  const tmat = (url,u) => { const m = new BABYLON.StandardMaterial('t', sV);
    m.diffuseTexture = new BABYLON.Texture(url, sV);
    m.diffuseTexture.uScale = u; m.diffuseTexture.vScale = u;
    m.specularColor = BABYLON.Color3.Black(); return m; };
  const box = (w,h,d,x,y,z,m) => { const b = BABYLON.MeshBuilder.CreateBox('b',{width:w,height:h,depth:d},sV);
    b.position.set(x,y,z); b.material = m; b.receiveShadows = true; sg.addShadowCaster(b); return b; };
  box(16,3.4,16, 0,-1.7,0, tmat('assets/tex_stone.png',5));
  box(15.6,0.5,15.6, 0,0.2,0, tmat('assets/tex_grass.png',6));
  box(9,0.14,9, 0.5,0.5,0.5, tmat('assets/tex_stone.png',7));
  box(9,1.2,6, 1,0.9,-4.5, tmat('assets/tex_stone.png',4));
  for (let i=0;i<3;i++) box(3,0.28,0.7, 0,0.55+i*0.28,-1.2-i*0.62, mat('#DBC294'));
  const sea = BABYLON.MeshBuilder.CreateGround('sea',{width:70,height:70},sV);
  sea.position.y = -3.55;
  const sm = new BABYLON.StandardMaterial('sea',sV);
  sm.diffuseColor = BABYLON.Color3.FromHexString('#2E7FA6');
  sm.specularColor = new BABYLON.Color3(0.12,0.14,0.16); sea.material = sm; sea.receiveShadows = true;
  box(3.4,0.35,2.2, -8.2,-2.4,5.6, mat('#855C33'));
  let luzzu = null, walker = null, dogA = null;
  let wt = new BABYLON.Vector3(3,0.55,2), dt2 = new BABYLON.Vector3(-2,0.55,3);
  const place = (file,h,x,y,z,ry,cb) => {
    BABYLON.SceneLoader.ImportMesh('', 'assets/', file, sV, (meshes,p2,sk,ags) => {
      const root = meshes[0];
      let mn = new BABYLON.Vector3(1e9,1e9,1e9), mx = new BABYLON.Vector3(-1e9,-1e9,-1e9);
      meshes.forEach(mm => { if(!mm.getBoundingInfo) return;
        const bb = mm.getHierarchyBoundingVectors();
        mn = BABYLON.Vector3.Minimize(mn, bb.min); mx = BABYLON.Vector3.Maximize(mx, bb.max); });
      const s = h / Math.max(0.01, mx.y - mn.y);
      root.scaling.scaleInPlace(s);
      root.position.set(x, y - mn.y*s, z);
      root.rotationQuaternion = null; root.rotation.y = ry;
      meshes.forEach(mm => sg.addShadowCaster(mm));
      ags.forEach(a => a.stop());
      if (cb) cb(root, ags); else ags.forEach(a => a.start(true));
    });
  };
  place('house.glb',3.2,-4.6,0.45,0.6,0.55);
  place('windmill.glb',5.2,5.4,0.45,-1.2,-1.83);
  place('well.glb',1.9,0.6,0.62,0.8,0);
  place('olive.glb',2.6,-6.2,0.45,-4.6,0.7);
  place('olive.glb',2.2,6.4,0.45,4.6,2.8);
  place('luzzu.glb',1.9,-5.6,-3.3,7.6,0.44,(r,a)=>{ luzzu=r; a.forEach(x=>x.start(true)); });
  place('man_walk.glb',1.7,3,0.55,2,0,(r,a)=>{ walker=r; a.forEach(x=>x.start(true)); });
  place('dog_a.glb',0,0,0,0,0,(r,a)=>{ r.scaling.setAll(0.45); r.position.set(-2,0.55,3);
    const w = a.find(x=>/Walk/i.test(x.name)); if (w) w.start(true); dogA = r; });
  place('dog_b.glb',0,0,0,0,0,(r,a)=>{ r.scaling.setAll(0.4); r.position.set(1.6,0.55,4.2); r.rotation.y = 2.4;
    const idle = a.find(x=>/Idle/i.test(x.name)) || a[0]; if (idle) idle.start(true);
    const jump = a.find(x=>/Jump/i.test(x.name));
    if (jump) setInterval(()=>{ idle&&idle.stop(); jump.start(false);
      jump.onAnimationGroupEndObservable.addOnce(()=> idle && idle.start(true)); }, 6000); });
  let t = 0;
  sV.onBeforeRenderObservable.add(() => {
    const dt = engine.getDeltaTime()/1000; t += dt;
    if (luzzu){ luzzu.position.y = -3.3 + Math.sin(t*1.1)*0.07; luzzu.rotation.z = Math.sin(t*1.4)*0.05; }
    const mv = (n, tgt, sp) => {
      if (!n) return tgt;
      const d = tgt.subtract(n.position); d.y = 0;
      if (d.length() < 0.4) return new BABYLON.Vector3(-4+Math.random()*9, 0.55, -3+Math.random()*8);
      const dir = d.normalize(); n.position.addInPlace(dir.scale(dt*sp));
      n.rotation.y = Math.atan2(dir.x, dir.z) + (n === dogA ? 0 : Math.PI);
      return tgt;
    };
    wt = mv(walker, wt, 1.1); dt2 = mv(dogA, dt2, 1.6);
  });
}

// =================================================================
// SCENE 2 — 3D SLOT (camera locked)
// =================================================================
const sS = new BABYLON.Scene(engine);
let spinning = false, lever, reels = [], psCoins, bulbs = [];
{
  sS.clearColor = BABYLON.Color4.FromHexString('#2A1030FF');
  new BABYLON.ArcRotateCamera('cs', -Math.PI/2, 1.42, 14.5, new BABYLON.Vector3(0,3.1,0), sS); // locked
  new BABYLON.HemisphericLight('h', new BABYLON.Vector3(0,1,0), sS).intensity = 0.85;
  new BABYLON.PointLight('k', new BABYLON.Vector3(0,6,7), sS).intensity = 1.6;
  const warm = new BABYLON.PointLight('w', new BABYLON.Vector3(0,3.2,4), sS);
  warm.diffuse = BABYLON.Color3.FromHexString('#FFCE7A'); warm.intensity = 1.0;
  const fill = new BABYLON.PointLight('f2', new BABYLON.Vector3(-5,2,5), sS);
  fill.diffuse = BABYLON.Color3.FromHexString('#FF9AC0'); fill.intensity = 0.45;
  // Vegas glow
  const glow = new BABYLON.GlowLayer('gl', sS); glow.intensity = 0.42;
  // warm gradient backdrop
  const bgTex = new BABYLON.DynamicTexture('bg', {width:16, height:256}, sS);
  const bctx = bgTex.getContext();
  const grad = bctx.createLinearGradient(0,0,0,256);
  grad.addColorStop(0, '#5A1E6E'); grad.addColorStop(0.55, '#3A1240'); grad.addColorStop(1, '#14060A');
  bctx.fillStyle = grad; bctx.fillRect(0,0,16,256); bgTex.update();
  const bgMat = new BABYLON.StandardMaterial('bgm', sS);
  bgMat.emissiveTexture = bgTex; bgMat.diffuseColor = BABYLON.Color3.Black(); bgMat.disableLighting = true;
  const bgP = BABYLON.MeshBuilder.CreatePlane('bgp', {width:60, height:40}, sS);
  bgP.position.set(0, 6, 14); bgP.material = bgMat;
  // floating gold dust
  const dustT = new BABYLON.DynamicTexture('du', {width:32,height:32}, sS);
  const dctx = dustT.getContext();
  dctx.beginPath(); dctx.arc(16,16,7,0,7); dctx.fillStyle = '#FFE9A0'; dctx.fill(); dustT.update();
  const dust = new BABYLON.ParticleSystem('dust', 60, sS);
  dust.particleTexture = dustT;
  dust.emitter = new BABYLON.Vector3(0, 4, 2);
  dust.minEmitBox = new BABYLON.Vector3(-9,-5,-2); dust.maxEmitBox = new BABYLON.Vector3(9,6,2);
  dust.minSize = 0.04; dust.maxSize = 0.14;
  dust.minLifeTime = 4; dust.maxLifeTime = 8;
  dust.emitRate = 8; dust.minEmitPower = 0.05; dust.maxEmitPower = 0.2;
  dust.direction1 = new BABYLON.Vector3(-0.2,0.4,0); dust.direction2 = new BABYLON.Vector3(0.2,0.8,0);
  dust.color1 = new BABYLON.Color4(1,0.9,0.55,0.5); dust.color2 = new BABYLON.Color4(1,0.75,0.4,0.35);
  dust.colorDead = new BABYLON.Color4(1,0.9,0.6,0);
  dust.start();
  const mat = (hex,sp=0.08) => { const m = new BABYLON.StandardMaterial('m', sS);
    m.diffuseColor = BABYLON.Color3.FromHexString(hex);
    m.specularColor = new BABYLON.Color3(sp,sp,sp); return m; };
  const GOLD = mat('#F5C75E',0.7); GOLD.emissiveColor = BABYLON.Color3.FromHexString('#4A370C');
  const RED = mat('#C22F28',0.2), DARK = mat('#7E1A1E',0.12);
  RED.emissiveColor = BABYLON.Color3.FromHexString('#2E0908');
  DARK.emissiveColor = BABYLON.Color3.FromHexString('#1E0606');
  const box = (w,h,d,x,y,z,m) => { const b = BABYLON.MeshBuilder.CreateBox('b',{width:w,height:h,depth:d},sS);
    b.position.set(x,y,z); b.material = m; return b; };
  box(6.6,5.2,2.6, 0,2.6,0, RED);
  box(0.5,5.2,2.7,-3.3,2.6,0,GOLD); box(0.5,5.2,2.7,3.3,2.6,0,GOLD);
  box(7.4,0.5,3.0,0,0.25,0,GOLD); box(7.0,0.45,2.8,0,5.35,0,GOLD);
  box(5.6,1.15,0.5,0,6.15,-0.6,DARK);
  box(5.9,0.22,0.55,0,6.78,-0.6,GOLD); box(5.9,0.22,0.55,0,5.55,-0.6,GOLD);
  const st = new BABYLON.DynamicTexture('sign',{width:1024,height:200},sS);
  st.drawText('VIVA IL-FESTA!', null, 145, '900 130px Arial', '#FFE08A', '#6E1418', true);
  const sMat = new BABYLON.StandardMaterial('sm',sS);
  sMat.diffuseTexture = st; sMat.emissiveColor = new BABYLON.Color3(0.55,0.42,0.18);
  const sp = BABYLON.MeshBuilder.CreatePlane('sp',{width:5.4,height:1.05},sS);
  sp.position.set(0,6.15,-0.87); sp.material = sMat;
  box(5.4,2.3,0.6,0,3.35,-1.05,DARK);
  box(7.6,0.9,3.4,0,-0.45,0,DARK);
  lever = new BABYLON.TransformNode('lever',sS); lever.position.set(3.85,3.4,0);
  const arm = BABYLON.MeshBuilder.CreateCylinder('arm',{height:2.2,diameter:0.22},sS);
  arm.material = GOLD; arm.parent = lever; arm.position.y = 1.1;
  const kn = BABYLON.MeshBuilder.CreateSphere('kn',{diameter:0.66},sS);
  kn.material = RED; kn.parent = lever; kn.position.y = 2.3;
  for (let i=0;i<14;i++){
    const b = BABYLON.MeshBuilder.CreateSphere('bl',{diameter:0.17},sS);
    b.position.set(-2.8+(i%7)*0.94, i<7?4.72:2.02, -1.36);
    const bm = new BABYLON.StandardMaterial('bm'+i,sS);
    bm.emissiveColor = BABYLON.Color3.FromHexString('#FFE08A'); b.material = bm; bulbs.push(b);
  }
  const stripMat = new BABYLON.StandardMaterial('strip',sS);
  const stripTex = new BABYLON.Texture('assets/reel_strip.png',sS);
  stripMat.diffuseTexture = stripTex;
  stripMat.emissiveTexture = stripTex;          // backlit reels — always bright
  stripMat.disableLighting = true;
  stripMat.specularColor = BABYLON.Color3.Black();
  for (let i=0;i<3;i++){
    const h = new BABYLON.TransformNode('rh'+i,sS);
    h.position.set(-1.7+i*1.7,3.35,-0.95); h.rotation.z = Math.PI/2;
    const cyl = BABYLON.MeshBuilder.CreateCylinder('reel'+i,{height:1.5,diameter:2.1,tessellation:48},sS);
    cyl.material = stripMat; cyl.parent = h;
    reels.push({ cyl, rot: Math.random()*6.28, speed: 0, target: null, done: true });
    cyl.rotation.y = reels[i].rot;
  }
  // win-line frame (flashes on win)
  const wlMat = new BABYLON.StandardMaterial('wl', sS);
  wlMat.emissiveColor = BABYLON.Color3.FromHexString('#FFE08A');
  wlMat.alpha = 0.0; wlMat.disableLighting = true;
  const winline = BABYLON.MeshBuilder.CreateBox('wl', {width:5.5, height:0.09, depth:0.1}, sS);
  winline.position.set(0, 3.35, -1.75); winline.material = wlMat;
  sS._wlMat = wlMat;
  // glass shine over the reels
  const glMat = new BABYLON.StandardMaterial('glass', sS);
  glMat.diffuseColor = new BABYLON.Color3(1,1,1); glMat.alpha = 0.05;
  glMat.emissiveColor = new BABYLON.Color3(0.5,0.55,0.65);
  const glass = BABYLON.MeshBuilder.CreatePlane('gp', {width:5.3, height:2.15}, sS);
  glass.position.set(0, 3.55, -1.72); glass.material = glMat;
  const ct = new BABYLON.DynamicTexture('coin',{width:64,height:64},sS);
  const cc = ct.getContext();
  cc.beginPath(); cc.arc(32,32,26,0,7); cc.fillStyle = '#FFD24A'; cc.fill();
  cc.lineWidth = 5; cc.strokeStyle = '#B8860B'; cc.stroke(); ct.update();
  psCoins = new BABYLON.ParticleSystem('ps',220,sS);
  psCoins.particleTexture = ct;
  psCoins.emitter = new BABYLON.Vector3(0,3.3,-1.4);
  psCoins.minEmitPower = 5; psCoins.maxEmitPower = 9;
  psCoins.direction1 = new BABYLON.Vector3(-2,4,-3); psCoins.direction2 = new BABYLON.Vector3(2,7,-1);
  psCoins.gravity = new BABYLON.Vector3(0,-14,0);
  psCoins.minSize = 0.14; psCoins.maxSize = 0.3;
  psCoins.minLifeTime = 0.7; psCoins.maxLifeTime = 1.4;
  psCoins.emitRate = 0; psCoins.start();
  // confetti burst
  const cfT = new BABYLON.DynamicTexture('cf',{width:32,height:32},sS);
  cfT.getContext().fillStyle = '#FFFFFF'; cfT.getContext().fillRect(6,6,20,20); cfT.update();
  const cf = new BABYLON.ParticleSystem('cf', 300, sS);
  cf.particleTexture = cfT;
  cf.emitter = new BABYLON.Vector3(0, 6.5, -1);
  cf.minEmitPower = 6; cf.maxEmitPower = 12;
  cf.direction1 = new BABYLON.Vector3(-4, 3, -4); cf.direction2 = new BABYLON.Vector3(4, 8, -1);
  cf.gravity = new BABYLON.Vector3(0, -11, 0);
  cf.minSize = 0.1; cf.maxSize = 0.22;
  cf.minLifeTime = 0.9; cf.maxLifeTime = 1.8;
  cf.color1 = new BABYLON.Color4(1,0.35,0.45,1); cf.color2 = new BABYLON.Color4(0.4,0.8,1,1);
  cf.colorDead = new BABYLON.Color4(1,0.85,0.3,0);
  cf.minAngularSpeed = -8; cf.maxAngularSpeed = 8;
  cf.emitRate = 0; cf.start();
  sS._cf = cf; sS._machine = null;
  let t = 0;
  sS.onBeforeRenderObservable.add(() => {
    const dt = engine.getDeltaTime()/1000; t += dt;
    const rate = spinning ? 16 : 6;
    bulbs.forEach((b,i) => b.material.emissiveColor =
      (Math.floor(t*rate)%2 === i%2) ? BABYLON.Color3.FromHexString('#FFE9A0') : BABYLON.Color3.FromHexString('#6B5320'));
    reels.forEach(R => {
      if (R.done) return;
      if (R.target === null) R.rot += R.speed*dt;
      else { const d = R.target - R.rot;
        if (d <= 0.01){ R.rot = R.target; R.done = true; if (R.onstop){ R.onstop(); R.onstop = null; } }
        else R.rot += Math.max(1.6, d*4.2)*dt; }
      R.cyl.rotation.y = R.rot;
    });
  });
}
const SEG = Math.PI/3;
const PRIZES = [
  { t: '💰 +{n} coins!', c: [400,900] }, { t: '👑 JACKPOT +{n}!', c: [1500,3000] },
  { t: '🔨 ATTACK bounty +{n}!', c: [900,1800] }, { t: '🦊 RAID bounty +{n}!', c: [1600,3200] },
  { t: '⚡ +{n} spins!', s: [2,4] }, { t: '🥟 +{n} coins', c: [90,240] } ];
const W = [34,10,13,8,14,21];
let bet = 1;
document.querySelectorAll('.bet').forEach(b => b.addEventListener('click', () => {
  bet = +b.dataset.b; sfx.click();
  document.querySelectorAll('.bet').forEach(x => x.classList.toggle('on', x === b));
  spinBtn.textContent = bet > 1 ? 'SPIN x' + bet : 'SPIN';
}));
let tickT = null;
function doSpin(){
  if (spinning || spins < bet) { if (spins < bet) toast('Not enough spins for x' + bet + '!'); return; }
  spins -= bet; spinning = true; hud(); save();
  sfx.lever();
  tickT = setInterval(sfx.tick, 90);
  BABYLON.Animation.CreateAndStartAnimation('lv', lever, 'rotation.x', 60, 14, 0, -1.1, 0);
  setTimeout(() => BABYLON.Animation.CreateAndStartAnimation('lv2', lever, 'rotation.x', 60, 20, -1.1, 0, 0), 260);
  let tw = W.reduce((a,b)=>a+b,0), r = Math.random()*tw, pi = 0;
  for (let i=0;i<W.length;i++){ r -= W[i]; if (r < 0){ pi = i; break; } }
  reels.forEach((R,i) => {
    R.done = false; R.speed = 14+i*2; R.target = null;
    // near-miss tension: the 3rd reel holds out much longer
    const delay = i < 2 ? 650+i*520 : 2350;
    setTimeout(() => {
      const base = Math.ceil(R.rot/(Math.PI*2))*Math.PI*2;
      R.target = base + Math.PI*2*(2+i) + pi*SEG;
      R.onstop = () => sfx.stop(i);
    }, delay);
  });
  const chk = setInterval(() => {
    if (!reels.every(R => R.done)) return;
    clearInterval(chk); clearInterval(tickT); spinning = false;
    const P = PRIZES[pi];
    let n = 0;
    if (P.c){ n = (P.c[0] + Math.floor(Math.random()*(P.c[1]-P.c[0]))) * bet; coins += n; }
    if (P.s){ n = (P.s[0] + Math.floor(Math.random()*(P.s[1]-P.s[0]+1))) * bet; spins += n; }
    toast(P.t.replace('{n}', n));
    const jack = pi === 1;
    psCoins.manualEmitCount = jack ? 220 : 140;
    sS._cf.manualEmitCount = jack ? 300 : 120;
    if (jack) sfx.jackpot(); else sfx.win();
    sfx.coin();
    document.getElementById('flash').classList.remove('go');
    void document.getElementById('flash').offsetWidth;
    document.getElementById('flash').classList.add('go');
    // win-line flash
    let wl = 0;
    const wlI = setInterval(() => { sS._wlMat.alpha = sS._wlMat.alpha > 0 ? 0 : 0.9; if (++wl > 7){ clearInterval(wlI); sS._wlMat.alpha = 0; } }, 130);
    hud(); save();
  }, 120);
}
spinBtn.addEventListener('click', doSpin);

// =================================================================
// SCENE 3 — CRUSH: full level mode (shaped boards, moves, targets)
// =================================================================
const sC = new BABYLON.Scene(engine);
let busyC = false;
const SHAPES = [
  ["1111111","1111111","1111111","1111111","1111111","1111111","1111111"],   // full
  ["0011100","0111110","1111111","1111111","1111111","0111110","0011100"],   // diamond
  ["1100011","1110111","1111111","0111110","1111111","1110111","1100011"],   // bowtie X
  ["1111111","1111111","1100011","1100011","1100011","1111111","1111111"],   // ring
  ["0111110","1111111","1111111","1111111","0111110","0011100","0001000"],   // heart-ish
  ["0011100","0011100","1111111","1111111","1111111","0011100","0011100"],   // cross
  ["1111111","0111110","0011100","0001000","0011100","0111110","1111111"],   // hourglass
  ["1000001","1100011","1110111","1111111","1110111","1100011","1000001"],   // arrowhead
];
let lvl = +(localStorage.pm_lvl ?? 1);
let mask, movesLeft = 20, target = 600, prog = 0;
const lvEl = document.getElementById('lv'), progEl = document.getElementById('prog'),
      tgtEl = document.getElementById('tgt'), mvsEl = document.getElementById('mvs');
function lvlHud(){ lvEl.textContent = lvl; progEl.textContent = prog; tgtEl.textContent = target; mvsEl.textContent = movesLeft; }
let camC;
{
  sC.clearColor = BABYLON.Color4.FromHexString('#2A1410FF');
  const N = 7, S = 1.06;
  camC = new BABYLON.ArcRotateCamera('cc', -Math.PI/2, Math.PI/2, 12, new BABYLON.Vector3(0,-0.1,0), sC); // locked, front-on
  new BABYLON.HemisphericLight('h', new BABYLON.Vector3(0,1,0), sC).intensity = 0.9;
  new BABYLON.PointLight('p', new BABYLON.Vector3(0,4,-8), sC).intensity = 0.6;
  const FOODS = ['figolla','imqaret','p-irkotta','pizza','p-pizelli','qaghaq'];
  const mats = FOODS.map(f => { const m = new BABYLON.StandardMaterial(f,sC);
    const tx = new BABYLON.Texture('tiles/'+f+'.png',sC);
    m.diffuseTexture = tx; m.emissiveTexture = tx;      // backlit tiles, always bright
    m.diffuseTexture.hasAlpha = true; m.useAlphaFromDiffuseTexture = true;
    m.disableLighting = true; m.backFaceCulling = false; return m; });
  const backMat = new BABYLON.StandardMaterial('bk',sC);
  backMat.diffuseColor = BABYLON.Color3.FromHexString('#4A2418');
  backMat.emissiveColor = BABYLON.Color3.FromHexString('#241009');
  backMat.specularColor = BABYLON.Color3.Black();
  const px = c => (c-(N-1)/2)*S, py = r => ((N-1)/2-r)*S;
  let grid = [], backs = [], sel = null;
  const on = (r,c) => r>=0 && r<N && c>=0 && c<N && mask[r][c] === '1';
  const at = (r,c) => grid[r*N+c];
  const mk = (r,c,k,fromTop) => {
    const p = BABYLON.MeshBuilder.CreatePlane('t',{size:0.96},sC);
    p.position.set(px(c), py(r) + (fromTop ? S*3.2 : 0), 0);
    p.material = mats[k]; p.metadata = { r,c,k }; return p;
  };
  function fitCamera(){
    let r0=N, r1=-1, c0=N, c1=-1;
    for (let r=0;r<N;r++) for (let c=0;c<N;c++) if (on(r,c)){ r0=Math.min(r0,r); r1=Math.max(r1,r); c0=Math.min(c0,c); c1=Math.max(c1,c); }
    const w = (c1-c0+1)*S + 0.8, h = (r1-r0+1)*S + 0.8;
    const vw = (window.visualViewport ? visualViewport.width : innerWidth);
    const vh = (window.visualViewport ? visualViewport.height : innerHeight);
    const aspect = vw / vh;
    const vfov = camC.fov;                                   // vertical
    const hfov = 2*Math.atan(Math.tan(vfov/2)*aspect);
    const availH = 0.55;                                     // fraction of screen height for the board (HUD + tabs eat the rest)
    const rH = (h/availH/2)/Math.tan(vfov/2);
    const rW = (w/2)/Math.tan(hfov/2)*1.1;
    // ORDER MATTERS: setting .target rebuilds radius from the current position — target first, radius last
    camC.target = new BABYLON.Vector3((px(c0)+px(c1))/2, (py(r0)+py(r1))/2 - 0.15, 0);
    camC.radius = Math.max(rH, rW);
  }
  function buildLevel(){
    grid.forEach(g => g && g.dispose()); backs.forEach(b => b.dispose());
    grid = []; backs = []; sel = null;
    mask = SHAPES[(lvl-1) % SHAPES.length];
    target = 500 + (lvl-1)*350;
    movesLeft = Math.max(14, 24 - Math.floor((lvl-1)/2));
    prog = 0;
    for (let r=0;r<N;r++) for (let c=0;c<N;c++){
      if (!on(r,c)){ grid[r*N+c] = null; continue; }
      const bp = BABYLON.MeshBuilder.CreatePlane('bk',{size:1.0},sC);
      bp.position.set(px(c), py(r), 0.12); bp.material = backMat; backs.push(bp);
      let k;
      do { k = Math.floor(Math.random()*6); }
      while ((on(r,c-1) && on(r,c-2) && at(r,c-1) && at(r,c-2) && at(r,c-1).metadata.k===k && at(r,c-2).metadata.k===k) ||
             (on(r-1,c) && on(r-2,c) && at(r-1,c) && at(r-2,c) && at(r-1,c).metadata.k===k && at(r-2,c).metadata.k===k));
      grid[r*N+c] = mk(r,c,k);
    }
    fitCamera(); lvlHud();
  }
  const anim = (m,prop,to,fr=12) => new Promise(res =>
    BABYLON.Animation.CreateAndStartAnimation('a', m, prop, 60, fr,
      prop.split('.').reduce((o,p)=>o[p],m), to, 0, new BABYLON.QuadraticEase(), res));
  const findM = () => {
    const dead = new Set();
    for (let r=0;r<N;r++) for (let c=0;c<N-2;c++){
      if (!on(r,c)||!on(r,c+1)||!on(r,c+2)) continue;
      const k = at(r,c).metadata.k;
      if (at(r,c+1).metadata.k===k && at(r,c+2).metadata.k===k){
        let e=c+2; while(e+1<N && on(r,e+1) && at(r,e+1).metadata.k===k) e++;
        for(let i=c;i<=e;i++) dead.add(r*N+i); } }
    for (let c=0;c<N;c++) for (let r=0;r<N-2;r++){
      if (!on(r,c)||!on(r+1,c)||!on(r+2,c)) continue;
      const k = at(r,c).metadata.k;
      if (at(r+1,c).metadata.k===k && at(r+2,c).metadata.k===k){
        let e=r+2; while(e+1<N && on(e+1,c) && at(e+1,c).metadata.k===k) e++;
        for(let i=r;i<=e;i++) dead.add(i*N+c); } }
    return [...dead];
  };
  async function resolve(){
    let chain = 0;
    while (true){
      const dead = findM();
      if (!dead.length) break;
      chain++;
      const pts = dead.length * 12 * chain;
      prog += pts;
      const won = dead.length * 2 * chain;
      coins += won; hud(); save(); lvlHud();
      sfx.match(chain);
      await Promise.all(dead.map(i => anim(grid[i],'scaling.x',0.01,9)));
      dead.forEach(i => { grid[i].dispose(); grid[i] = null; });
      const drops = [];
      for (let c=0;c<N;c++){
        const cells = [];
        for (let r=0;r<N;r++) if (on(r,c)) cells.push(r);
        const alive = cells.map(r => grid[r*N+c]).filter(Boolean);
        for (let i=0;i<cells.length;i++) grid[cells[i]*N+c] = null;
        // survivors settle to the bottom of the shape
        for (let i=0;i<alive.length;i++){
          const r = cells[cells.length - alive.length + i];
          grid[r*N+c] = alive[i]; alive[i].metadata.r = r; alive[i].metadata.c = c;
          drops.push(anim(alive[i],'position.y',py(r),12));
        }
        // new tiles rain into the rest
        for (let i=0;i<cells.length-alive.length;i++){
          const r = cells[i];
          const tl = mk(r,c,Math.floor(Math.random()*6),true);
          grid[r*N+c] = tl;
          drops.push(anim(tl,'position.y',py(r),14));
        }
      }
      await Promise.all(drops);
    }
    if (prog >= target){
      busyC = true;
      const bonus = 200 + movesLeft*40 + lvl*50;
      coins += bonus; spins += 1;
      sfx.jackpot();
      document.getElementById('flash').classList.remove('go');
      void document.getElementById('flash').offsetWidth;
      document.getElementById('flash').classList.add('go');
      toast('🎉 LEVEL ' + lvl + ' COMPLETE! +' + bonus + ' coins, +1 spin!');
      lvl++; localStorage.pm_lvl = lvl; hud(); save();
      setTimeout(() => { buildLevel(); busyC = false; }, 1600);
    } else if (movesLeft <= 0){
      busyC = true;
      toast('💔 Out of moves — retry level ' + lvl + '!');
      blip(200,.3,'sawtooth',.15,-120);
      setTimeout(() => { buildLevel(); busyC = false; }, 1500);
    }
  }
  async function swap(a,b){
    busyC = true;
    const {r:r1,c:c1} = a.metadata, {r:r2,c:c2} = b.metadata;
    await Promise.all([anim(a,'position.x',px(c2),8),anim(a,'position.y',py(r2),8),
                       anim(b,'position.x',px(c1),8),anim(b,'position.y',py(r1),8)]);
    grid[r1*N+c1]=b; grid[r2*N+c2]=a;
    a.metadata.r=r2; a.metadata.c=c2; b.metadata.r=r1; b.metadata.c=c1;
    if (findM().length){
      movesLeft--; lvlHud();
      await resolve();
      if (prog < target && movesLeft > 0) busyC = false;
    }
    else {
      await Promise.all([anim(a,'position.x',px(c1),8),anim(a,'position.y',py(r1),8),
                         anim(b,'position.x',px(c2),8),anim(b,'position.y',py(r2),8)]);
      grid[r1*N+c1]=a; grid[r2*N+c2]=b;
      a.metadata.r=r1; a.metadata.c=c1; b.metadata.r=r2; b.metadata.c=c2;
      blip(160,.12,'square',.1);
      busyC = false;
    }
  }
  sC.onPointerObservable.add(pi2 => {
    if (active !== 'c' || pi2.type !== BABYLON.PointerEventTypes.POINTERDOWN || busyC) return;
    const hit = sC.pick(sC.pointerX, sC.pointerY, m => m.metadata && m.metadata.k !== undefined);
    if (!hit.hit){ if (sel){ sel.scaling.setAll(1); sel = null; } return; }
    const m = hit.pickedMesh;
    sfx.click();
    if (!sel){ sel = m; m.scaling.setAll(1.18); return; }
    if (m === sel){ sel.scaling.setAll(1); sel = null; return; }
    const dr = Math.abs(m.metadata.r - sel.metadata.r), dc = Math.abs(m.metadata.c - sel.metadata.c);
    const prev = sel; prev.scaling.setAll(1); sel = null;
    if (dr + dc === 1) swap(prev, m);
    else { sel = m; m.scaling.setAll(1.18); }
  });
  sC.attachControl();          // multi-scene: input must be attached explicitly
  window._crush = { get sel(){ return !!sel; }, get moves(){ return movesLeft; }, get cam(){ return { r: camC.radius, tx: camC.target.x, ty: camC.target.y, fov: camC.fov, rw: engine.getRenderWidth(), rh: engine.getRenderHeight() }; } };
  const dbg = new URLSearchParams(location.search).get('lvl');
  if (dbg) lvl = +dbg;
  buildLevel();
  addEventListener('resize', () => setTimeout(() => { engine.resize(); fitCamera(); }, 120));
  if (window.visualViewport) visualViewport.addEventListener('resize', () => setTimeout(() => { engine.resize(); fitCamera(); }, 120));
  addEventListener('orientationchange', () => setTimeout(() => { engine.resize(); fitCamera(); }, 250));
}

// ---------- tab manager ----------
const scenes = { v: sV, s: sS, c: sC };
let active = 'v';
const tabs = { v: document.getElementById('tb-v'), s: document.getElementById('tb-s'), c: document.getElementById('tb-c') };
function go(k){
  active = k;
  for (const key in tabs) tabs[key].classList.toggle('on', key === k);
  spinBtn.style.display = k === 's' ? 'block' : 'none';
  document.getElementById('bets').style.display = k === 's' ? 'flex' : 'none';
  document.getElementById('lvlbar').style.display = k === 'c' ? 'flex' : 'none';
  msgEl.textContent = '';
  sfx.click();
}
tabs.v.addEventListener('click', () => go('v'));
tabs.s.addEventListener('click', () => go('s'));
tabs.c.addEventListener('click', () => go('c'));
go(new URLSearchParams(location.search).get('tab') || 'v'); hud();

engine.runRenderLoop(() => scenes[active].render());
addEventListener('resize', () => engine.resize());
</script>
